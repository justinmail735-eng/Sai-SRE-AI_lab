replicaCount: 2

image:
  repository: local-checkout-api
  tag: latest
  # Production GitOps values set an immutable sha256 digest. When present it
  # takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  automount: false

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics
  prometheus.io/port: "8080"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 128Mi

probes:
  startup:
    path: /healthz
    failureThreshold: 12
    periodSeconds: 2
  readiness:
    path: /healthz
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2
  liveness:
    path: /healthz
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

topologySpread:
  minDomains: 2
  whenUnsatisfiable: DoNotSchedule

terminationGracePeriodSeconds: 30
