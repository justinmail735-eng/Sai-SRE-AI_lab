services:
  checkout-api:
    build:
      context: ../../applications/checkout-api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 10
    networks: [sentinel]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "9464:9464"
    depends_on:
      checkout-api:
        condition: service_healthy
    networks: [sentinel]

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../generated/checkout-api/prometheus-rules.yaml:/etc/prometheus/rules/checkout-api.yaml:ro
    ports:
      - "9090:9090"
    depends_on: [otel-collector]
    networks: [sentinel]

  grafana:
    image: grafana/grafana:12.2.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: sentinel-demo
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../generated/checkout-api/dashboard.json:/var/lib/grafana/dashboards/checkout-api.json:ro
    ports:
      - "3001:3000"
    depends_on: [prometheus]
    networks: [sentinel]

networks:
  sentinel:
    name: sentinel-sre-local
