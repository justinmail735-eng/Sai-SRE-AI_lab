name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Validate markdown exists
        run: |
          test -f README.md
          test -f docs/roadmap/SPRINT-7D.md

  slo-policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Run SLO policy evaluator
        run: |
          python3 scripts/slo_check.py --input projects/01-slo-engine/sample-slo.json

      - name: Run SLO evaluator tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v

  continuous-reliability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Verify generated observability and current SLO policy
        run: |
          python3 scripts/reliability_check.py

  multi-cloud-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@ae78205cfffec9e8d93fd2b3115c7e9d3166d4b6 # v5.0.0
      - name: Validate and test AWS and Azure foundations
        run: python3 scripts/terraform_validate.py

  gitops-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - uses: yokawasa/action-setup-kube-tools@9e25a4277af127b60011c95b6ed2da7e3b3613b1 # v0.11.2
        with:
          setup-tools: |
            kustomize
            conftest
          kustomize: 5.8.1
          conftest: 0.69.0
      - name: Render GitOps resources and enforce admission policy
        run: python3 scripts/gitops_validate.py

  portfolio-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build, render-test, and lint the interview portfolio
        working-directory: web
        run: |
          npm ci
          npm test
          npm run lint

  live-observability-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Start instrumented reliability lab
        run: |
          docker compose -f observability/local/docker-compose.yml up --build -d
      - name: Verify application-to-dashboard telemetry path
        run: |
          python3 scripts/live_stack_check.py
      - name: Preserve service diagnostics
        if: failure()
        run: |
          docker compose -f observability/local/docker-compose.yml ps
          docker compose -f observability/local/docker-compose.yml logs --no-color --tail=200
      - name: Stop reliability lab
        if: always()
        run: |
          docker compose -f observability/local/docker-compose.yml down --volumes --remove-orphans

  kubernetes-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Lint and validate Helm safeguards
        run: |
          helm lint platform/helm/checkout-api
          python3 scripts/k8s_validate.py

  kubernetes-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: sentinelsre
          config: platform/kind/cluster.yaml
      - name: Build and load checkout image
        run: |
          docker build -t local-checkout-api:latest applications/checkout-api
          kind load docker-image local-checkout-api:latest --name sentinelsre
      - name: Install hardened Helm release
        run: |
          kubectl create namespace sentinelsre
          helm upgrade --install checkout platform/helm/checkout-api \
            --namespace sentinelsre \
            --values platform/helm/checkout-api/values-kind.yaml \
            --wait --timeout 3m
      - name: Verify live Kubernetes safeguards and networking
        run: |
          python3 scripts/k8s_runtime_check.py
      - name: Prove bounded recovery from one local Pod loss
        run: |
          python3 scripts/k8s_chaos_check.py \
            --execute \
            --acknowledge DELETE-ONE-LOCAL-CHECKOUT-POD \
            --output build/k8s-chaos-result.json
          python3 scripts/k8s_runtime_check.py
      - name: Preserve cluster diagnostics
        if: failure()
        run: |
          kubectl get all,networkpolicy,poddisruptionbudget -n sentinelsre -o wide
          kubectl get events -n sentinelsre --sort-by=.lastTimestamp
